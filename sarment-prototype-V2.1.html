/* ---------------------------------- Helpers ---------------------------------- */

const DAY = 86400000;
const NOW = Date.now();
const daysAgo = (n) => new Date(NOW - n * DAY).toISOString();
const daysSince = (iso) => (iso ? Math.floor((NOW - new Date(iso).getTime()) / DAY) : null);
const fmt = (n) => String(n).replace(".", ",");

function ParcelGlyph({ type, size = 14 }) {
  const color = type === "rouge" ? COLORS.sarment : COLORS.ambre;
  return <Leaf size={size} color={color} />;
}

function CuveGlyph({ size = 14 }) {
  return <FlaskConical size={size} color={COLORS.raisin} />;
}

function urgency(days, interval) {
  if (days === null) return { label: "non renseigné", color: COLORS.nuitSoft };
  const ratio = days / interval;
  if (ratio <= 0.7) return { label: "à jour", color: COLORS.feuille };
  if (ratio <= 1) return { label: "bientôt dû", color: COLORS.ambre };
  return { label: "en retard", color: COLORS.alerte };
}

function severity(days, interval) {
  if (days === null) return 1;
  const ratio = days / interval;
  if (ratio <= 0.7) return 0;
  if (ratio <= 1) return 1;
  return 2;
}

let uid = 1000;
const nextId = () => `t${uid++}`;

function makeParcelTasks(labels, doneLabels = []) {
  return labels.map((label) => ({ id: nextId(), label, done: doneLabels.includes(label) }));
}

function freshStageTasks(templates = DEFAULT_STAGE_TASKS) {
  const obj = {};
  STAGES.forEach((s) => {
    obj[s] = (templates[s] || []).map((label) => ({ id: nextId(), label, done: false }));
  });
  return obj;
}

function LogoMark({ size = 26 }) {
  // Logo officiel Sarment : image extraite et détourée à partir de la charte de marque
  // (fond transparent, ratio d'origine conservé). Voir la constante SARMENT_LOGO_URI.
  const ratio = 295 / 360; // hauteur / largeur du fichier source
  return (
    <img
      src={SARMENT_LOGO_URI}
      alt="Sarment"
      width={size}
      height={Math.round(size * ratio)}
      style={{ display: "block", objectFit: "contain" }}
      draggable={false}
    />
  );
}

function Header({ title, subtitle, onBack, icon, onOpenCalendar }) {
  return (
    <div
      className="sticky top-0 z-10 px-5 py-4 flex items-center gap-3"
      style={{ backgroundColor: COLORS.craie, borderBottom: `1px solid ${COLORS.ligne}` }}
    >
      {onBack && (
        <button
          onClick={onBack}
          aria-label="Retour"
          className="flex items-center justify-center rounded-full shrink-0"
          style={{ width: 36, height: 36, backgroundColor: COLORS.sarmentLight }}
        >
          <ChevronLeft size={19} color={COLORS.sarment} />
        </button>
      )}
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-1.5 min-w-0">
          {icon && (
            <span className="flex items-center" style={{ flexShrink: 0 }}>{icon}</span>
          )}
          <div className="font-semibold truncate" style={{ color: COLORS.nuit, fontSize: 16.5 }}>
            {title}
          </div>
        </div>
        {subtitle && (
          <div className="truncate" style={{ color: COLORS.nuitSoft, fontSize: 12.5, marginTop: 1 }}>
            {subtitle}
          </div>
        )}
      </div>
      {onOpenCalendar && (
        <button
          onClick={onOpenCalendar}
          aria-label="Calendrier"
          title="Calendrier"
          className="flex items-center justify-center rounded-full shrink-0"

          <CalendarIcon size={17} color={COLORS.sarment} />
        </button>
      )}
    </div>
  );
}

function ProgressBar({ pct, color }) {
  return (
    <div style={{ height: 7, borderRadius: 999, backgroundColor: COLORS.craieDeep, overflow: "hidden" }}>
      <div
        style={{
          height: "100%",
          width: `${Math.max(0, Math.min(100, pct))}%`,
          backgroundColor: color,
          transition: "width 320ms ease",

}

function SuiviCard({ label, days, urg, onDone }) {

function FieldInput({ label, value, onChange, placeholder, type = "text" }) {
  return (
    <div>
      <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.nuitSoft, marginBottom: 6 }}>{label}</div>
      <input
        type={type}
        value={value}
        onChange={(e) => onChange(e.target.value)}
        placeholder={placeholder}
        className="w-full rounded-xl px-3.5 py-2.5"
        style={{ border: `1px solid ${COLORS.ligne}`, fontSize: 14, backgroundColor: "#fff", color: COLORS.nuit }}
      />
    </div>

function TaskRow({ task, accent, editing, onToggle, onRemove, assignment, employees, onOpenAssign }) {
  const assignedNames = assignment
    ? assignment.employeeIds.map((id) => employees.find((e) => e.id === id)?.nom.split(" ")[0]).filter(Boolean)
    : [];
  return (
    <div
      className="flex flex-col gap-1.5 rounded-xl px-3 py-2.5"
      style={{ backgroundColor: "#fff", border: `1px solid ${COLORS.ligne}` }}
    >
      <div className="flex items-center gap-3">
        <button
          onClick={onToggle}
          aria-label={task.done ? "Marquer non fait" : "Marquer fait"}
          className="flex items-center justify-center rounded-md shrink-0"
          style={{
            width: 20,
            height: 20,
            border: `1.5px solid ${task.done ? accent : COLORS.ligne}`,
            backgroundColor: task.done ? accent : "transparent",
            transition: "all 150ms ease",
          }}
        >
          {task.done && <Check size={13} color="#fff" />}
        </button>
        <span
          className="flex-1"
          style={{
            fontSize: 13.5,
            color: task.done ? COLORS.nuitSoft : COLORS.nuit,
            textDecoration: task.done ? "line-through" : "none",
          }}
        >
          {task.label}
        </span>
        {!editing && onOpenAssign && (
          <button
            onClick={onOpenAssign}
            aria-label="Assigner cette tâche"
            className="flex items-center justify-center rounded-full shrink-0"
            style={{ width: 26, height: 26, backgroundColor: assignment ? COLORS.sarmentLight : COLORS.craieDeep }}
          >
            <UserPlus size={13} color={assignment ? COLORS.sarment : COLORS.nuitSoft} />
          </button>
        )}
        {editing && (
          <button onClick={onRemove} aria-label="Supprimer la tâche" style={{ color: COLORS.alerte }}>
            <X size={16} />
          </button>
        )}
      </div>
      {assignment && (
        <button
          onClick={onOpenAssign}
          className="flex items-center gap-1.5 flex-wrap text-left"
          style={{ paddingLeft: 32 }}
        >
          <PriorityBadge level={assignment.priority} />
          <span style={{ fontSize: 11, color: COLORS.nuitSoft }}>
            {assignedNames.join(", ")} · {assignment.deadline}
          </span>
        </button>
      )}
    </div>
  );
}

/* ---------------------------------- Gestion parcellaire ---------------------------------- */

function ParcelList({ parcelles, onOpen, onBack, onAdd, onOpenCalendar }) {
  return (
    <div>
      <Header title="Gestion parcellaire" subtitle={`${parcelles.length} parcelles`} onBack={onBack} onOpenCalendar={onOpenCalendar} />
      <div className="px-5 py-5 grid grid-cols-2 gap-3">
        {parcelles.map((p) => {
          const dt = daysSince(p.dernierTraitement);
          const df = daysSince(p.dernierFauchage);
          const sevMax = Math.max(severity(dt, 12), severity(df, 15));
          const statusColor = sevMax === 0 ? COLORS.feuille : sevMax === 1 ? COLORS.ambre : COLORS.alerte;
          const done = p.tasks.filter((t) => t.done).length;
          const total = p.tasks.length;
          const pct = total ? (done / total) * 100 : 0;
          const accent = p.type === "rouge" ? COLORS.sarment : COLORS.ambre;
          return (
            <button
              key={p.id}
              onClick={() => onOpen(p.id)}
              className="text-left rounded-2xl p-3.5 flex flex-col gap-2"
              style={{ backgroundColor: "#fff", border: `1px solid ${COLORS.ligne}`, borderLeft: `4px solid ${accent}` }}
            >
              <div className="flex items-start justify-between gap-1">
                <div className="flex items-center gap-1.5 min-w-0">
                  <span className="flex items-center" style={{ flexShrink: 0 }}>
                    <ParcelGlyph type={p.type} />
                  </span>
                  <div className="font-semibold truncate" style={{ color: COLORS.nuit, fontSize: 14, lineHeight: 1.2 }}>
                    {p.nom}
                  </div>
                </div>
                <span
                  style={{ width: 9, height: 9, borderRadius: 999, backgroundColor: statusColor, marginTop: 4, flexShrink: 0 }}
                />
              </div>
              <div style={{ color: COLORS.nuitSoft, fontSize: 12 }}>
                {p.cepage} · {fmt(p.surface)} ha
              </div>
              <div>
                <ProgressBar pct={pct} color={statusColor} />
                <div style={{ fontSize: 11, color: COLORS.nuitSoft, marginTop: 4 }}>

          onClick={onAdd}

        >
          <Plus size={20} />
          <span style={{ fontSize: 12.5, fontWeight: 600 }}>Ajouter une parcelle</span>
        </button>
      </div>
    </div>
  );
}

function ParcelDetail({ parcel, onBack, onUpdate, employees, assignments, onSaveAssignment, onRemoveAssignment, onOpenCalendar }) {
  const [editing, setEditing] = useState(false);
  const [newTask, setNewTask] = useState("");
  const [assigningTask, setAssigningTask] = useState(null);

  const dt = daysSince(parcel.dernierTraitement);
  const df = daysSince(parcel.dernierFauchage);
  const uT = urgency(dt, 12);
  const uF = urgency(df, 15);
  const done = parcel.tasks.filter((t) => t.done).length;
  const total = parcel.tasks.length;

  const markToday = (field) => onUpdate({ ...parcel, [field]: new Date().toISOString() });
  const toggleTask = (id) =>
    onUpdate({ ...parcel, tasks: parcel.tasks.map((t) => (t.id === id ? { ...t, done: !t.done } : t)) });
  const removeTask = (id) => onUpdate({ ...parcel, tasks: parcel.tasks.filter((t) => t.id !== id) });
  const addTask = () => {
    if (!newTask.trim()) return;
    onUpdate({ ...parcel, tasks: [...parcel.tasks, { id: nextId(), label: newTask.trim(), done: false }] });
    setNewTask("");
  };
  const setEtat = (etat) => {
    let tasks = parcel.tasks;
    if (etat === "jeune") tasks = tasks.filter((t) => t.label !== "Vendanges");
    else if (!tasks.some((t) => t.label === "Vendanges"))
      tasks = [...tasks, { id: nextId(), label: "Vendanges", done: false }];
    onUpdate({ ...parcel, etat, tasks });
  };
  const resetSaison = () => onUpdate({ ...parcel, tasks: parcel.tasks.map((t) => ({ ...t, done: false })) });

  return (
    <div>
      <Header
        title={parcel.nom}
        subtitle={`${parcel.cepage} · ${fmt(parcel.surface)} ha`}
        onBack={onBack}
        icon={<ParcelGlyph type={parcel.type} size={17} />}
        onOpenCalendar={onOpenCalendar}
      />
      <div className="px-5 py-5 flex flex-col gap-6">
        <div className="flex rounded-full p-1" style={{ backgroundColor: COLORS.craieDeep }}>
          {[
            ["jeune", "Jeune plantation"],
            ["production", "En production"],
          ].map(([val, label]) => (
            <button
              key={val}
              onClick={() => setEtat(val)}
              className="flex-1 rounded-full py-2 text-center"
              style={{
                fontSize: 12.5,
                fontWeight: 600,
                backgroundColor: parcel.etat === val ? COLORS.feuille : "transparent",
                color: parcel.etat === val ? "#fff" : COLORS.nuitSoft,
                transition: "all 200ms ease",
              }}
            >
              {label}
            </button>
          ))}
        </div>

        <div className="flex flex-col gap-3">
          <div style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.nuitSoft }}>Suivis récurrents</div>
          <SuiviCard label="Dernier traitement" days={dt} urg={uT} onDone={() => markToday("dernierTraitement")} />
          <SuiviCard label="Dernier fauchage" days={df} urg={uF} onDone={() => markToday("dernierFauchage")} />
        </div>

        <div className="flex flex-col gap-3">
          <div className="flex items-center justify-between">
            <div style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.nuitSoft }}>
              Travaux de l'année · {done}/{total}
            </div>
            <button
              onClick={() => setEditing((e) => !e)}
              className="flex items-center gap-1"
              style={{ color: COLORS.sarment, fontSize: 12.5, fontWeight: 600 }}
            >
              <Pencil size={13} /> {editing ? "Terminer" : "Modifier"}
            </button>
          </div>
          <ProgressBar pct={total ? (done / total) * 100 : 0} color={COLORS.feuille} />
          <div className="flex flex-col gap-1.5">
            {parcel.tasks.map((t) => (
              <TaskRow
                key={t.id}
                task={t}
                accent={COLORS.feuille}
                editing={editing}
                onToggle={() => toggleTask(t.id)}
                onRemove={() => removeTask(t.id)}
                assignment={assignments[t.id]}
                employees={employees}
                onOpenAssign={() => setAssigningTask(t)}
              />
            ))}
            {editing && (
              <div className="flex items-center gap-2 mt-1">
                <input
                  value={newTask}
                  onChange={(e) => setNewTask(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && addTask()}
                  placeholder="Ajouter une tâche…"
                  className="flex-1 rounded-xl px-3 py-2"
                  style={{ border: `1px solid ${COLORS.ligne}`, fontSize: 13.5, backgroundColor: "#fff" }}
                />
                <button
                  onClick={addTask}
                  aria-label="Ajouter la tâche"
                  className="rounded-xl flex items-center justify-center shrink-0"
                  style={{ width: 36, height: 36, backgroundColor: COLORS.sarment }}
                >
                  <Plus size={16} color="#fff" />
                </button>
              </div>
            )}
          </div>
        </div>

        <button
          onClick={resetSaison}
          className="self-start"
          style={{ fontSize: 12, color: COLORS.nuitSoft, textDecoration: "underline" }}
        >
          Réinitialiser pour la nouvelle saison
        </button>
      </div>
      {assigningTask && (
        <AssignTaskModal
          task={assigningTask}
          targetName={`${parcel.nom} · ${parcel.cepage}`}
          employees={employees}
          existingAssignment={assignments[assigningTask.id]}
          onClose={() => setAssigningTask(null)}
          onSave={(data) => {
            onSaveAssignment({
              taskId: assigningTask.id,
              taskLabel: assigningTask.label,
              targetType: "parcelle",
              targetId: parcel.id,
              targetName: parcel.nom,
              ...data,
            });
            setAssigningTask(null);
          }}
          onUnassign={() => {
            onRemoveAssignment(assigningTask.id);
            setAssigningTask(null);
          }}
        />
      )}
    </div>
  );
}

function BottlingCard({ cuve, onUpdate }) {
  const [editing, setEditing] = useState(!cuve.bottling);
  const [count, setCount] = useState(cuve.bottling ? String(cuve.bottling.bottles) : "");

  const litersFromBottles = (n) => Math.round(n * 0.75);

  const save = () => {
    const n = parseInt(count, 10);
    if (!n || n <= 0) return;
    onUpdate({ ...cuve, bottling: { bottles: n, date: new Date().toISOString() } });
    setEditing(false);
  };

  return (
    <div className="rounded-2xl p-4 flex flex-col gap-3" style={{ backgroundColor: COLORS.raisinLight, border: `1px solid ${COLORS.ligne}` }}>
      <div className="flex items-center gap-2">
        <span style={{ fontSize: 19 }}>🍾</span>
        <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.raisin }}>Mise en bouteille</div>
      </div>

      {!editing && cuve.bottling ? (
        <>
          <div style={{ fontSize: 24, fontWeight: 800, color: COLORS.nuit }}>
            {cuve.bottling.bottles.toLocaleString("fr-FR")} bouteilles
          </div>
          <div style={{ fontSize: 12.5, color: COLORS.nuitSoft }}>
            Format 75 cl · soit environ {litersFromBottles(cuve.bottling.bottles)} L · le{" "}
            {new Date(cuve.bottling.date).toLocaleDateString("fr-FR")}
          </div>
          <button
            onClick={() => setEditing(true)}
            className="self-start flex items-center gap-1"
            style={{ color: COLORS.raisin, fontSize: 12.5, fontWeight: 600 }}
          >
            <Pencil size={13} /> Modifier
          </button>
        </>
      ) : (
        <>
          <div style={{ fontSize: 12.5, color: COLORS.nuitSoft }}>Combien de bouteilles (75 cl) ont été produites ?</div>
          <div className="flex items-center gap-2">
            <input
              type="number"
              value={count}
              onChange={(e) => setCount(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && save()}
              placeholder="ex. 1200"
              className="flex-1 rounded-xl px-3 py-2.5"
              style={{ border: `1px solid ${COLORS.ligne}`, fontSize: 15, backgroundColor: "#fff" }}
            />
            <button
              onClick={save}
              className="rounded-xl px-4 py-2.5 shrink-0"
              style={{ backgroundColor: COLORS.raisin, color: "#fff", fontWeight: 700, fontSize: 13 }}
            >
              Enregistrer
            </button>
          </div>
        </>
      )}
    </div>
  );
}

function CuveDetail({ cuve, onBack, onUpdate, employees, assignments, onSaveAssignment, onRemoveAssignment, onOpenCalendar }) {

  const ds = daysSince(cuve.dernierSoutirage);
  const uS = urgency(ds, 10);
  const stageIndex = STAGES.indexOf(cuve.etape);
  const tasks = cuve.tasksByStage[cuve.etape];
  const done = tasks.filter((t) => t.done).length;

  const markSoutirage = () => onUpdate({ ...cuve, dernierSoutirage: new Date().toISOString() });
  const setEtape = (etape) => onUpdate({ ...cuve, etape });
  const toggleTask = (id) =>
    onUpdate({
      ...cuve,
      tasksByStage: { ...cuve.tasksByStage, [cuve.etape]: tasks.map((t) => (t.id === id ? { ...t, done: !t.done } : t)) },
    });
  const removeTask = (id) =>
    onUpdate({ ...cuve, tasksByStage: { ...cuve.tasksByStage, [cuve.etape]: tasks.filter((t) => t.id !== id) } });
  const addTask = () => {
    if (!newTask.trim()) return;
    onUpdate({
      ...cuve,
      tasksByStage: { ...cuve.tasksByStage, [cuve.etape]: [...tasks, { id: nextId(), label: newTask.trim(), done: false }] },
    });
    setNewTask("");
  };
  const addNote = () => {
    if (!newNote.trim()) return;
    onUpdate({ ...cuve, notes: [{ id: nextId(), text: newNote.trim(), date: new Date().toISOString() }, ...cuve.notes] });
    setNewNote("");
  };

  return (
    <div>
      <Header

        subtitle={`${cuve.cepage} · ${cuve.origine} · ${cuve.volume} L`}

          <select
            value={cuve.etape}

            className="w-full rounded-xl px-3 py-2.5"

            style={{ backgroundColor: "#fff", border: `1px solid ${COLORS.ligne}`, fontSize: 12.5, color: COLORS.nuitSoft }}

              <Pencil size={13} /> {editing ? "Terminer" : "Modifier"}
            </button>
          </div>
          <div className="flex flex-col gap-1.5">
            {tasks.map((t) => (
              <TaskRow
                key={t.id}
                task={t}
                accent={COLORS.raisin}
                editing={editing}
                onToggle={() => toggleTask(t.id)}
                onRemove={() => removeTask(t.id)}
                assignment={assignments[t.id]}
                employees={employees}
                onOpenAssign={() => setAssigningTask(t)}
              />
            ))}
            {editing && (
              <div className="flex items-center gap-2 mt-1">
                <input
                  value={newTask}
                  onChange={(e) => setNewTask(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && addTask()}
                  placeholder="Ajouter une tâche pour cette étape…"
                  className="flex-1 rounded-xl px-3 py-2"
                  style={{ border: `1px solid ${COLORS.ligne}`, fontSize: 13.5, backgroundColor: "#fff" }}
                />
                <button
                  onClick={addTask}

                  className="rounded-xl flex items-center justify-center shrink-0"
                  style={{ width: 36, height: 36, backgroundColor: COLORS.raisin }}

                  <Plus size={16} color="#fff" />

              </div>

          </div>
          <div style={{ fontSize: 11, color: COLORS.nuitSoft }}>
            Ces tâches ne s'appliquent qu'à cette cuve, sans modifier le modèle par défaut des autres cuves.
          </div>
        </div>

        <div className="rounded-2xl" style={{ border: `1px solid ${COLORS.ligne}`, backgroundColor: "#fff", overflow: "hidden" }}>
          <button onClick={() => setNotesOpen((o) => !o)} className="w-full flex items-center justify-between px-4 py-3">
            <div className="flex items-center gap-2">
              <MessageSquare size={15} color={COLORS.nuitSoft} />

              size={16}
              color={COLORS.nuitSoft}
              style={{ transform: notesOpen ? "rotate(180deg)" : "none", transition: "transform 200ms ease" }}

          {notesOpen && (
            <div className="px-4 pb-4 flex flex-col gap-2.5" style={{ borderTop: `1px solid ${COLORS.ligne}`, paddingTop: 12 }}>
              {cuve.notes.map((n) => (
                <div key={n.id}>
                  <div style={{ fontSize: 13, color: COLORS.nuit }}>{n.text}</div>
                  <div style={{ fontSize: 10.5, color: COLORS.nuitSoft, marginTop: 2 }}>
                    {new Date(n.date).toLocaleDateString("fr-FR")}
                  </div>
                </div>
              ))}
              <div className="flex items-center gap-2 mt-1">
                <input
                  value={newNote}
                  onChange={(e) => setNewNote(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && addNote()}

                  onClick={addNote}
                  aria-label="Ajouter l'observation"
                  className="rounded-xl flex items-center justify-center shrink-0"
                  style={{ width: 34, height: 34, backgroundColor: COLORS.sarmentLight }}
                >
                  <Plus size={15} color={COLORS.sarment} />
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
      {assigningTask && (
        <AssignTaskModal
          task={assigningTask}
          targetName={`${cuve.nom} · ${cuve.origine}`}
          employees={employees}
          existingAssignment={assignments[assigningTask.id]}
          onClose={() => setAssigningTask(null)}
          onSave={(data) => {
            onSaveAssignment({
              taskId: assigningTask.id,
              taskLabel: assigningTask.label,
              targetType: "cuve",
              targetId: cuve.id,
              targetName: cuve.nom,
              ...data,
            });
            setAssigningTask(null);
          }}
          onUnassign={() => {
            onRemoveAssignment(assigningTask.id);
            setAssigningTask(null);
          }}
        />
      )}
    </div>
  );
}

/* ---------------------------------- Assignation de tâches ---------------------------------- */

const PRIORITIES = [
  { key: "basse", label: "Basse" },
  { key: "normale", label: "Normale" },
  { key: "haute", label: "Haute" },
];
const DEADLINES = ["Aujourd'hui", "Demain", "Cette semaine"];

function priorityStyle(level) {
  if (level === "haute") return { backgroundColor: COLORS.sarment, color: "#fff" };
  if (level === "basse") return { backgroundColor: COLORS.craieDeep, color: COLORS.nuitSoft };
  return { backgroundColor: COLORS.sarmentLight, color: COLORS.sarment };
}

function PriorityBadge({ level }) {
  const st = priorityStyle(level);
  const label = PRIORITIES.find((p) => p.key === level)?.label || level;
  return (
    <span className="rounded-full px-2 py-0.5 shrink-0" style={{ fontSize: 10.5, fontWeight: 700, ...st }}>
      {label}
    </span>
  );
}

function AssignTaskModal({ task, targetName, employees, existingAssignment, onClose, onSave, onUnassign }) {
  const [employeeIds, setEmployeeIds] = useState(existingAssignment ? existingAssignment.employeeIds : []);
  const [priority, setPriority] = useState(existingAssignment ? existingAssignment.priority : "normale");
  const [deadline, setDeadline] = useState(existingAssignment ? existingAssignment.deadline : "Aujourd'hui");

  const toggleEmployee = (id) =>
    setEmployeeIds((ids) => (ids.includes(id) ? ids.filter((x) => x !== id) : [...ids, id]));

  const submit = () => {
    if (employeeIds.length === 0) return;
    onSave({ employeeIds, priority, deadline });
  };

  return (
    <Modal title="Assigner cette tâche" onClose={onClose}>
      <div className="flex flex-col gap-5">
        <div>
          <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.nuit }}>{task.label}</div>
          <div style={{ fontSize: 12.5, color: COLORS.nuitSoft, marginTop: 2 }}>{targetName}</div>
        </div>

        <div className="flex flex-col gap-2">
          <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.nuitSoft }}>Employé(s)</div>
          {employees.length === 0 ? (
            <div style={{ fontSize: 12.5, color: COLORS.nuitSoft }}>
              Aucun employé enregistré pour l'instant.
            </div>
          ) : (
            <div className="flex flex-col gap-1.5">
              {employees.map((e) => {
                const checked = employeeIds.includes(e.id);
                return (
                  <button
                    key={e.id}
                    onClick={() => toggleEmployee(e.id)}
                    className="w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-left"
                    style={{
                      backgroundColor: checked ? COLORS.feuilleLight : "#fff",
                      border: `1px solid ${checked ? COLORS.feuille : COLORS.ligne}`,
                    }}
                  >
                    <div
                      className="flex items-center justify-center rounded-md shrink-0"
                      style={{

function LoadingScreen({ onDone, label, duration = 1300 }) {
  const [filled, setFilled] = useState(false);

  useEffect(() => {
    const startTimer = setTimeout(() => setFilled(true), 30);
    const doneTimer = setTimeout(() => onDone && onDone(), duration);
    return () => {
      clearTimeout(startTimer);
      clearTimeout(doneTimer);
    };
  }, [onDone, duration]);

  return (
    <div className="h-full flex flex-col items-center justify-center gap-8 px-10">
      <div style={{ animation: "pulseLogo 1.6s ease-in-out infinite" }}>
        <LogoMark size={76} />
      </div>
      <div className="w-full flex flex-col items-center gap-3">
        <div
          style={{
            width: "68%",
            height: 6,
            borderRadius: 999,
            backgroundColor: COLORS.craieDeep,
            overflow: "hidden",
          }}
        >
          <div
            style={{
              height: "100%",
              width: filled ? "100%" : "6%",
              backgroundColor: COLORS.sarment,
              borderRadius: 999,
              transition: `width ${duration - 100}ms cubic-bezier(0.4, 0, 0.2, 1)`,
            }}
          />
        </div>
        {label && <div style={{ fontSize: 12.5, color: COLORS.nuitSoft }}>{label}</div>}
      </div>
    </div>
  );
}

function parseSucrositeValue(str) {
  const m = String(str).replace(",", ".").match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function parseSucrositeUnit(str) {
  const m = String(str)
    .replace(",", ".")
    .match(/-?\d+(\.\d+)?\s*(.*)/);
  return m && m[2] ? m[2].trim() : "";
}

function SucrositeChart({ tests }) {
  const points = tests
    .slice()
    .reverse() // stockés du plus récent au plus ancien -> on remet dans l'ordre chronologique
    .map((t) => ({ ...t, value: parseSucrositeValue(t.valeur) }))
    .filter((t) => t.value !== null);

  if (points.length < 2) {
    return (
      <div style={{ fontSize: 11.5, color: COLORS.nuitSoft, fontStyle: "italic" }}>
        Ajoute au moins 2 tests pour voir l'évolution.
      </div>
    );
  }

  const values = points.map((p) => p.value);
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const W = 280;
  const H = 116;
  const padX = 16;
  const padY = 16;
  const stepX = (W - padX * 2) / (points.length - 1);

  const coords = points.map((p, i) => ({
    ...p,
    x: padX + i * stepX,
    y: H - padY - ((p.value - min) / range) * (H - padY * 2),
  }));

  const pathD = coords.map((c, i) => `${i === 0 ? "M" : "L"} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(" ");
  const unit = parseSucrositeUnit(points[points.length - 1].valeur);

  return (
    <div className="flex flex-col gap-1">
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{ overflow: "visible" }}>
        <line x1={padX} y1={H - padY} x2={W - padX} y2={H - padY} stroke={COLORS.ligne} strokeWidth="1" />
        <path d={pathD} fill="none" stroke={COLORS.ambre} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        {coords.map((c, i) => (
          <g key={i}>
            <circle cx={c.x} cy={c.y} r="3.5" fill={COLORS.ambre} />
            <text x={c.x} y={Math.max(c.y - 8, 9)} fontSize="9" fill={COLORS.nuit} textAnchor="middle" fontWeight="700">
              {c.value}
            </text>
            <text x={c.x} y={H - 1} fontSize="8" fill={COLORS.nuitSoft} textAnchor="middle">
              {new Date(c.date).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" })}
            </text>
          </g>
        ))}
      </svg>
      {unit && <div style={{ fontSize: 10.5, color: COLORS.nuitSoft, textAlign: "right" }}>Unité détectée : {unit}</div>}
    </div>
  );
}

  const [testDate, setTestDate] = useState(() => new Date().toISOString().slice(0, 10));

  const [pressDate, setPressDate] = useState(() => new Date().toISOString().slice(0, 10));
  const [pressRendement, setPressRendement] = useState("");
  const [pressNote, setPressNote] = useState("");

  const v = parcel.vendange;

  const markHarvested = () => onUpdate({ ...parcel, vendange: { ...v, recoltee: true, date: new Date().toISOString() } });
  const unmarkHarvested = () => onUpdate({ ...parcel, vendange: { ...v, recoltee: false, date: null } });

  const addTest = () => {
    if (!testValue.trim()) return;
    onUpdate({
      ...parcel,
      vendange: { ...v, tests: [{ id: nextId(), date: testDate, valeur: testValue.trim() }, ...v.tests] },
    });
    setTestValue("");
  };
  const removeTest = (id) => onUpdate({ ...parcel, vendange: { ...v, tests: v.tests.filter((t) => t.id !== id) } });
  const saveNote = () => onUpdate({ ...parcel, vendange: { ...v, note: noteDraft } });

  const startEditPressurage = () => {
    if (v.pressurage) {
      setPressDate(v.pressurage.date);
      setPressRendement(v.pressurage.rendement);
      setPressNote(v.pressurage.note || "");
    }
    setEditingPressurage(true);
  };
  const savePressurage = () => {
    if (!pressRendement.trim()) return;
    onUpdate({
      ...parcel,
      vendange: { ...v, pressurage: { date: pressDate, rendement: pressRendement.trim(), note: pressNote.trim() } },

    setEditingPressurage(false);

  return (

function CalendarScreen({ tasks, events, employees, onAddEvent, onRemoveEvent, onBack }) {
  const [adding, setAdding] = useState(false);

  const todayStr = new Date().toISOString().slice(0, 10);
  const tomorrowStr = new Date(Date.now() + DAY).toISOString().slice(0, 10);
  const weekLimitStr = new Date(Date.now() + 7 * DAY).toISOString().slice(0, 10);

  const employeeName = (id) => employees.find((e) => e.id === id)?.nom || "?";

  const tasksToday = tasks.filter((t) => t.deadline === "Aujourd'hui");
  const tasksTomorrow = tasks.filter((t) => t.deadline === "Demain");
  const tasksWeek = tasks.filter((t) => t.deadline === "Cette semaine");

  const eventsToday = events.filter((e) => e.date === todayStr);
  const eventsTomorrow = events.filter((e) => e.date === tomorrowStr);
  const eventsWeek = events.filter((e) => e.date > tomorrowStr && e.date <= weekLimitStr);
  const eventsLater = events.filter((e) => e.date > weekLimitStr).sort((a, b) => a.date.localeCompare(b.date));

  const laterByDate = {};
  eventsLater.forEach((e) => {
    laterByDate[e.date] = laterByDate[e.date] || [];
    laterByDate[e.date].push(e);
  });

  const nothingAtAll =
    tasksToday.length + tasksTomorrow.length + tasksWeek.length + events.length === 0;

  return (
    <div>
      <Header title="Calendrier" subtitle="Tâches et événements à venir" onBack={onBack} icon={<CalendarIcon size={16} color={COLORS.sarment} />} />
      <div className="px-5 py-5 flex flex-col gap-5">
        <button
          onClick={() => setAdding(true)}
          className="rounded-xl py-3 flex items-center justify-center gap-2"
          style={{ backgroundColor: COLORS.sarment, color: "#fff", fontWeight: 700, fontSize: 14 }}
        >
          <Plus size={16} color="#fff" /> Ajouter un événement
        </button>

        {nothingAtAll ? (
          <EmptyTasksCard label="Rien de prévu pour l'instant." />
        ) : (
          <>
            <CalendarBucket label="Aujourd'hui" tasks={tasksToday} events={eventsToday} employeeName={employeeName} onRemoveEvent={onRemoveEvent} />
            <CalendarBucket label="Demain" tasks={tasksTomorrow} events={eventsTomorrow} employeeName={employeeName} onRemoveEvent={onRemoveEvent} />
            <CalendarBucket
              label="Cette semaine"
              tasks={tasksWeek}
              events={eventsWeek}
              employeeName={employeeName}
              onRemoveEvent={onRemoveEvent}
              showEventDates
            />
          </>
        )}

        {Object.keys(laterByDate).length > 0 && (
          <div className="flex flex-col gap-3">
            <div style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.nuitSoft }}>Plus tard</div>
            {Object.entries(laterByDate).map(([date, evs]) => (
              <div key={date} className="flex flex-col gap-1.5">
                <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.sarment }}>
                  {new Date(date).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })}
                </div>
                {evs.map((e) => (
                  <EventRow key={e.id} event={e} onRemove={() => onRemoveEvent(e.id)} />
                ))}
              </div>
            ))}
          </div>
        )}
      </div>

      {adding && (
        <AddEventModal
          onClose={() => setAdding(false)}
          onAdd={(ev) => {
            onAddEvent(ev);
            setAdding(false);
          }}
        />
      )}
    </div>
  );
}

function SarmentApp() {
  const [parcelles, setParcelles] = useState(initialParcelles);
  const [cuves, setCuves] = useState(initialCuves);
  const [screen, setScreen] = useState("home");
  const [selectedParcel, setSelectedParcel] = useState(null);
  const [selectedCuve, setSelectedCuve] = useState(null);
  const [modal, setModal] = useState(null);

  const [authScreen, setAuthScreen] = useState("boot");
  const [pendingAuth, setPendingAuth] = useState(null);
  const [companyName, setCompanyName] = useState("Domaine des Trois Chênes");
  const [employees, setEmployees] = useState(DEFAULT_EMPLOYEES);
  const [currentEmployee, setCurrentEmployee] = useState(null);
  const [assignments, setAssignments] = useState({});
  const [dayNumber, setDayNumber] = useState(1);
  const [lastClosedDay, setLastClosedDay] = useState(null);
  const [events, setEvents] = useState([]);
  const addEvent = (ev) => setEvents((es) => [...es, ev]);
  const removeEvent = (id) => setEvents((es) => es.filter((e) => e.id !== id));

  const [parcelTaskTemplate, setParcelTaskTemplate] = useState(DEFAULT_PARCEL_TASKS);
  const [cuveTaskTemplates, setCuveTaskTemplates] = useState(DEFAULT_STAGE_TASKS);
  const addParcelTemplateTask = (label) => setParcelTaskTemplate((t) => [...t, label]);
  const removeParcelTemplateTask = (i) => setParcelTaskTemplate((t) => t.filter((_, idx) => idx !== i));
  const addCuveTemplateTask = (stage, label) =>
    setCuveTaskTemplates((t) => ({ ...t, [stage]: [...t[stage], label] }));
  const removeCuveTemplateTask = (stage, i) =>
    setCuveTaskTemplates((t) => ({ ...t, [stage]: t[stage].filter((_, idx) => idx !== i) }));
  const addParcelOnboarding = (p) => setParcelles((ps) => [...ps, p]);
  const removeParcelOnboarding = (id) => setParcelles((ps) => ps.filter((p) => p.id !== id));
  const addCuveOnboarding = (c) => setCuves((cs) => [...cs, c]);
  const removeCuveOnboarding = (id) => setCuves((cs) => cs.filter((c) => c.id !== id));

  const updateParcel = (updated) => setParcelles((ps) => ps.map((p) => (p.id === updated.id ? updated : p)));
  const updateCuve = (updated) => setCuves((cs) => cs.map((c) => (c.id === updated.id ? updated : c)));
  const saveAssignment = (record) => setAssignments((a) => ({ ...a, [record.taskId]: record }));
  const removeAssignment = (taskId) =>
    setAssignments((a) => {
      const copy = { ...a };
      delete copy[taskId];
      return copy;
    });

  const getTaskDoneState = (assignment) => {
    if (assignment.targetType === "parcelle") {
      const p = parcelles.find((x) => x.id === assignment.targetId);
      const t = p && p.tasks.find((x) => x.id === assignment.taskId);
      return t ? t.done : false;
    }
    const c = cuves.find((x) => x.id === assignment.targetId);
    if (!c) return false;
    for (const stage of STAGES) {
      const t = c.tasksByStage[stage].find((x) => x.id === assignment.taskId);
      if (t) return t.done;
    }
    return false;
  };

  const getEmployeeTasks = (employeeId) =>
    Object.values(assignments)
      .filter((a) => a.employeeIds.includes(employeeId))
      .map((a) => ({ ...a, done: getTaskDoneState(a) }));

  const getAllAssignments = () => Object.values(assignments).map((a) => ({ ...a, done: getTaskDoneState(a) }));

  const toggleAssignedTask = (assignment) => {
    if (assignment.targetType === "parcelle") {
      const p = parcelles.find((x) => x.id === assignment.targetId);
      if (!p) return;
      updateParcel({ ...p, tasks: p.tasks.map((t) => (t.id === assignment.taskId ? { ...t, done: !t.done } : t)) });
      return;
    }
    const c = cuves.find((x) => x.id === assignment.targetId);
    if (!c) return;
    for (const stage of STAGES) {
      if (c.tasksByStage[stage].some((t) => t.id === assignment.taskId)) {
        updateCuve({
          ...c,
          tasksByStage: {
            ...c.tasksByStage,
            [stage]: c.tasksByStage[stage].map((t) => (t.id === assignment.taskId ? { ...t, done: !t.done } : t)),
          },
        });
        return;
      }
    }
  };

  const parcel = parcelles.find((p) => p.id === selectedParcel);
  const cuve = cuves.find((c) => c.id === selectedCuve);

  const closeDay = () => {
    const perEmployee = employees
      .map((e) => {
        const mine = getEmployeeTasks(e.id).filter((t) => t.deadline === "Aujourd'hui");
        return {
          employeeId: e.id,
          nom: e.nom,
          done: mine.filter((t) => t.done).length,
          total: mine.length,
          completed: mine.filter((t) => t.done).map((t) => t.taskLabel),
          pending: mine.filter((t) => !t.done).map((t) => t.taskLabel),
        };
      })
      .filter((e) => e.total > 0);

    const snapshot = {
      day: dayNumber,
      date: new Date().toISOString(),
      perEmployee,
      totalDone: perEmployee.reduce((s, e) => s + e.done, 0),
      totalAssigned: perEmployee.reduce((s, e) => s + e.total, 0),
    };

    setAssignments((a) => {
      const next = {};
      Object.entries(a).forEach(([taskId, rec]) => {
        if (rec.deadline === "Aujourd'hui") {
          if (!getTaskDoneState(rec)) next[taskId] = rec; // pas fini -> reporté à demain (reste "Aujourd'hui")
        } else if (rec.deadline === "Demain") {
          next[taskId] = { ...rec, deadline: "Aujourd'hui" }; // demain devient aujourd'hui
        } else {
          next[taskId] = rec; // "Cette semaine" ne bouge pas
        }
      });
      return next;
    });

    setLastClosedDay(snapshot);
    setDayNumber((n) => n + 1);
    setScreen("day-summary");
  };

  const logout = () => {
    setAuthScreen("login");
    setScreen("home");
    setCurrentEmployee(null);
  };
  const finishCompanyStep = (nom) => {
    setCompanyName(nom);
    setAuthScreen("signup-parcelles");
  };
  const goSignup = () => {
    setParcelles([]);
    setCuves([]);
    setEmployees([]);
    setAssignments({});
    setParcelTaskTemplate([]);
    setCuveTaskTemplates(Object.fromEntries(STAGES.map((s) => [s, []])));
    setAuthScreen("signup-company");
  };
  const loginAsPatron = () => {
    setParcelles(initialParcelles);
    setCuves(initialCuves);
    setEmployees(DEFAULT_EMPLOYEES);
    setAssignments({});
    setParcelTaskTemplate(DEFAULT_PARCEL_TASKS);
    setCuveTaskTemplates(DEFAULT_STAGE_TASKS);
    setCompanyName("Domaine des Trois Chênes");
    setPendingAuth("patron");
    setAuthScreen("loading");
  };
  const addEmployee = (emp) => setEmployees((es) => [...es, emp]);
  const removeEmployee = (id) => setEmployees((es) => es.filter((e) => e.id !== id));
  const finishSignup = () => {
    setPendingAuth("patron");
    setAuthScreen("loading");
  };
  const selectEmployee = (emp) => {
    setCurrentEmployee(emp);
    setPendingAuth("employee");
    setAuthScreen("loading");
  };
  const landAfterLoading = () => {
    setAuthScreen(pendingAuth);
    if (pendingAuth === "patron") setScreen("home");
  };

  let content;
  if (authScreen === "boot") {
    content = <LoadingScreen label="La vigne simplifiée" onDone={() => setAuthScreen("login")} />;
  } else if (authScreen === "loading") {
    content = <LoadingScreen label="Préparation de ton espace…" onDone={landAfterLoading} />;
  } else if (authScreen === "login") {
    content = (
      <LoginScreen
        onLoginPatron={loginAsPatron}
        onGoEmployeeSelect={() => setAuthScreen("employee-select")}
        onGoSignup={goSignup}
      />
    );
  } else if (authScreen === "signup-company") {
    content = <SignupCompanyScreen onBack={() => setAuthScreen("login")} onContinue={finishCompanyStep} />;
  } else if (authScreen === "signup-parcelles") {
    content = (
      <SignupParcellesScreen
        template={parcelTaskTemplate}
        onAddTemplateTask={addParcelTemplateTask}
        onRemoveTemplateTask={removeParcelTemplateTask}
        parcelles={parcelles}
        onAddParcel={addParcelOnboarding}
        onRemoveParcel={removeParcelOnboarding}
        onBack={() => setAuthScreen("signup-company")}
        onNext={() => setAuthScreen("signup-cuves")}
      />
    );
  } else if (authScreen === "signup-cuves") {
    content = (
      <SignupCuvesScreen
        templates={cuveTaskTemplates}
        onAddTemplateTask={addCuveTemplateTask}
        onRemoveTemplateTask={removeCuveTemplateTask}
        parcelles={parcelles}
        cuves={cuves}
        onAddCuve={addCuveOnboarding}
        onRemoveCuve={removeCuveOnboarding}
        onBack={() => setAuthScreen("signup-parcelles")}
        onNext={() => setAuthScreen("signup-employees")}
      />
    );
  } else if (authScreen === "signup-employees") {
    content = (
      <SignupEmployeesScreen
        companyName={companyName}
        employees={employees}
        onAddEmployee={addEmployee}
        onRemoveEmployee={removeEmployee}
        onBack={() => setAuthScreen("signup-cuves")}
        onFinish={finishSignup}
      />
    );
  } else if (authScreen === "employee-select") {
    content = <EmployeeSelectScreen employees={employees} onBack={() => setAuthScreen("login")} onSelect={selectEmployee} />;
  } else if (authScreen === "employee") {
    content = (
      <EmployeeHome
        employee={currentEmployee}
        tasks={currentEmployee ? getEmployeeTasks(currentEmployee.id) : []}
        onToggleTask={toggleAssignedTask}
        onLogout={logout}
      />
    );
  } else if (screen === "home") {
    const teamToday = employees.reduce(
      (acc, e) => {
        const t = getEmployeeTasks(e.id).filter((x) => x.deadline === "Aujourd'hui");
        acc.done += t.filter((x) => x.done).length;
        acc.total += t.length;
        return acc;
      },
      { done: 0, total: 0 }
    );
    content = (
      <Home
        parcelles={parcelles}
        cuves={cuves}
        onNavigate={setScreen}
        companyName={companyName}
        onLogout={logout}
        teamToday={teamToday}
        onOpenTracking={() => setScreen("team-tracking")}
        onOpenVendanges={() => setScreen("vendanges")}
        onOpenCalendar={() => setScreen("calendar")}
      />
    );
  } else if (screen === "calendar") {
    content = (
      <CalendarScreen
        tasks={getAllAssignments()}
        events={events}
        employees={employees}
        onAddEvent={addEvent}
        onRemoveEvent={removeEvent}
        onBack={() => setScreen("home")}
      />
    );
  } else if (screen === "vendanges") {
    content = (
      <VendangesScreen
        parcelles={parcelles}
        onUpdate={updateParcel}
        onBack={() => setScreen("home")}
        onOpenCalendar={() => setScreen("calendar")}
      />
    );
  } else if (screen === "team-tracking") {
    content = (
      <TeamTrackingScreen
        employees={employees}
        getEmployeeTasks={getEmployeeTasks}
        onToggleTask={toggleAssignedTask}
        onBack={() => setScreen("home")}
        onCloseDay={closeDay}
        dayNumber={dayNumber}
        onOpenCalendar={() => setScreen("calendar")}
      />
    );
  } else if (screen === "day-summary" && lastClosedDay) {
    content = <DaySummaryScreen snapshot={lastClosedDay} onDone={() => setScreen("home")} />;
  } else if (screen === "parcel-list") {
    content = (
      <ParcelList
        parcelles={parcelles}
        onBack={() => setScreen("home")}
        onOpen={(id) => {
          setSelectedParcel(id);
          setScreen("parcel-detail");
        }}
        onAdd={() => setModal("parcel")}
        onOpenCalendar={() => setScreen("calendar")}
      />
    );
  } else if (screen === "parcel-detail" && parcel) {
    content = (
      <ParcelDetail
        parcel={parcel}
        onBack={() => setScreen("parcel-list")}
        onUpdate={updateParcel}
        employees={employees}
        assignments={assignments}
        onSaveAssignment={saveAssignment}
        onRemoveAssignment={removeAssignment}
        onOpenCalendar={() => setScreen("calendar")}
      />
    );
  } else if (screen === "cave-list") {
    content = (
      <CaveList
        cuves={cuves}
        onBack={() => setScreen("home")}
        onOpen={(id) => {
          setSelectedCuve(id);
          setScreen("cuve-detail");
        }}
        onAdd={() => setModal("cuve")}
        onOpenCalendar={() => setScreen("calendar")}
      />
    );
  } else if (screen === "cuve-detail" && cuve) {
    content = (
      <CuveDetail
        cuve={cuve}
        onBack={() => setScreen("cave-list")}
        onUpdate={updateCuve}
        employees={employees}
        assignments={assignments}
        onSaveAssignment={saveAssignment}
        onRemoveAssignment={removeAssignment}
        onOpenCalendar={() => setScreen("calendar")}
      />
    );
  } else {
    content = (
      <Home
        parcelles={parcelles}
        cuves={cuves}
        onNavigate={setScreen}
        companyName={companyName}
        onLogout={logout}
        teamToday={{ done: 0, total: 0 }}
        onOpenTracking={() => setScreen("team-tracking")}
        onOpenVendanges={() => setScreen("vendanges")}
        onOpenCalendar={() => setScreen("calendar")}
      />
    );
  }

  return (
    <div
      className="w-full flex justify-center"
      style={{
        backgroundColor: "#DDD3BE",
        minHeight: "100vh",
        padding: "28px 16px",
        fontFamily: "'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif",
      }}
    >
      <style>{`
        input:focus, select:focus, button:focus-visible { outline: 2px solid ${COLORS.sarment}; outline-offset: 1px; }
      `}</style>
      <div
        style={{
          width: "100%",
          maxWidth: 412,
          position: "relative",
          backgroundColor: COLORS.craie,
          borderRadius: 32,
          overflow: "hidden",
          border: `1px solid ${COLORS.craieDeep}`,
          boxShadow: "0 24px 48px -12px rgba(42,36,32,0.28)",
        }}
      >
        <div style={{ height: 720, overflowY: "auto" }}>{content}</div>
        {modal === "parcel" && (
          <AddParcelModal
            onClose={() => setModal(null)}
            onAdd={(p) => {
              setParcelles((ps) => [...ps, p]);
              setModal(null);
            }}
            taskTemplate={parcelTaskTemplate}
          />
        )}
        {modal === "cuve" && (
          <AddCuveModal
            onClose={() => setModal(null)}
            onAdd={(c) => {
              setCuves((cs) => [...cs, c]);
              setModal(null);
            }}
            parcelles={parcelles}
            taskTemplates={cuveTaskTemplates}
          />
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SarmentApp />);
</script>
</body>
</html>
